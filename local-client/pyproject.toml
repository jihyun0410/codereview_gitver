[project]
name = "codetest-local-client"
version = "0.1.0"
description = "Code Review AI Agent - Local Client (사용자 로컬 환경 배포용)"
requires-python = ">=3.10"

# 로컬 클라이언트는 의존성을 가볍게 유지한다.
# Test Code 생성·판정은 agent-server 가 담당하고,
# 여기서는 git 조회 · 테스트 실행 · REST 호출 · TUI 출력만 한다.
dependencies = [
    "typer>=0.12",   # CLI
    "rich>=13.7",    # TUI 렌더링
    "httpx>=0.27",   # Agent Server REST 호출
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
codetest = "codetest.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["codetest*"]
